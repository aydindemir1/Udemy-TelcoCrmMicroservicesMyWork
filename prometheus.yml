global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "identity-service"
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5000']
  
  - job_name: "customer-service"
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5001']
  
  - job_name: "search-service"
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5002']
  
  - job_name: "catalog-service"
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5003']
  
  - job_name: "basket-service"
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5004']
  
  - job_name: "sales-service"
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5005']
  
  - job_name: "invoice-service"
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5006']